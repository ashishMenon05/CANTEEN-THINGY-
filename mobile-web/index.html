<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080808">
    <title>Q-Pass</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, sans-serif; background: #080808; color: #f5f0e8; }
      body { box-sizing: border-box; display: grid; min-height: 100svh; margin: 0; padding: 2rem; place-items: center; }
      main { width: min(100%, 26rem); border: 1px solid #393327; border-radius: 1.5rem; padding: 2rem; background: #12110f; }
      h1 { margin: 0; color: #e0c070; font-size: 1.8rem; }
      p { color: #b4aea2; line-height: 1.6; }
      code { color: #e0c070; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <main>
      <h1>Q-Pass</h1>
      <p>Connect this app to the Q-Pass ordering server to browse today&apos;s menu and place a test order.</p>
      <p>Build the Android app with <code>CAPACITOR_SERVER_URL</code> set to the address of your running Q-Pass server.</p>
    </main>
  </body>
</html>
